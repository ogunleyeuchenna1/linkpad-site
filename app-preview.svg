<svg xmlns="http://www.w3.org/2000/svg" width="840" height="540" viewBox="0 0 840 540" fill="none">
  <defs>
    <linearGradient id="background" x1="140" y1="0" x2="740" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151a16"/>
      <stop offset="1" stop-color="#0f1210"/>
    </linearGradient>
    <linearGradient id="qr" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d5ff9c"/>
      <stop offset="1" stop-color="#b9f45e"/>
